  - id: F001
    title: "基于 shadcn 官方 dashboard-01 结构实现 BPO WFM Dashboard 静态首页"
    priority: P0
    status: done
    required_workflow: frontend-scaffold
    allowed_files:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "public/**"
