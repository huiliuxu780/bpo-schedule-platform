      - "AGENTS.md"
      - "docs/PROJECT_STATE.md"
      - "docs/dev/branch-log.md"
      - "tasks/backlog.yaml"
      - "scripts/check.sh"
    forbidden_files:
      - "backend/**"
      - "pnpm-lock.yaml"
      - "yarn.lock"
    acceptance:
      - "页面视觉和组件结构尽量贴近 shadcn/ui v4 官方 Examples Dashboard / dashboard-01。"
      - "实现 AppSidebar、SiteHeader、SectionCards、ChartAreaInteractive、DataTable、BpoHeatmap、DataSyncStatus、ThemeToggle。"
      - "左侧导航为两级结构，一级和二级菜单均有 lucide icon，异常管理显示 badge，P1/Beta 能力显示 tag。"
      - "Dashboard 首页顺序为 SiteHeader、Global filter bar、四个指标卡、趋势图 + 热力图、异常表格 + 数据接入状态面板。"
      - "指标卡一行四个，使用 shadcn Card 视觉结构，业务文案为中文。"
      - "趋势图展示排班实现率、排班拟合度、排班遵守率；F001 允许跟随官方 dashboard chart 结构使用 Recharts。"
      - "异常表格展示指定字段，并至少支持搜索、状态 badge、分页和行操作。"
      - "支持 dark / light 主题切换。"
      - "不接入后端、真实 Excel、真实 CORN API、权限系统、登录认证、数据库或智能排班算法。"
      - "`npm run lint`、`npm run build`、`npm run typecheck` 和 `bash scripts/check.sh` 通过，若外部依赖安装失败需说明。"
    auto_run: true
    pm_confirmation_required: true
    conflict_risk: medium
    stop_conditions:
      - "需要后端接口、真实导入、真实 CORN API、认证、数据库或智能排班算法"
      - "需要从 lab archive 复制代码"
      - "需要改变业务指标公式、状态码、结算公式或收费因子"
      - "依赖安装持续失败导致无法验证"
    commit_after_done: false
