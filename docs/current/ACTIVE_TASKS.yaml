    acceptance:
      - "新增 Alembic migration 和本地 DB persistence，覆盖 RosterVersion、RosterCell、RosterVersionEvent、RosterCellChangeLog、PublishedSnapshot、EditLock。"
      - "Repository/service 支持 saveDraft、validatePublish、schedulePublish、activateDuePublished、withdraw、createRevision、getActiveDraft、getCurrentPublished、getUpcomingPublished。"
      - "PublishedSnapshot 在发布时固化班次数、半小时覆盖、hard/soft/diff 摘要引用；历史发布结果不依赖未来规则实时重算。"
      - "service 层和 DB 层共同保证同 scope/month 只有一个 active draft、current published、scheduled published。"
      - "activateDuePublished(now) 作为 service 方法实现 scheduled_published 到点生效、旧 current superseded、失败 activation_failed；不新增后台 job、脚本、cron 或 worker。"
      - "EditLock 落库并由 service 用于草稿保存保护，覆盖 acquire、renew、release、forceRelease 和非持有者只读。"
      - "RosterCell 支持同员工同日多记录，用 version + employee + businessDate + sequence 作为稳定粒度；shift/leave/training/meeting/annotation 都能存，coverage 只统计 shift。"
      - "后端测试覆盖 draft 保存读回、active 唯一性、publish snapshot 固化、scheduled activation、withdraw、revision draft、edit lock、hard error 阻断、soft risk 可发布、migration head 创建表。"
      - "本轮不新增 API route、前端发布动作、权限、审批、通知、导出、批量、Excel 导入、Forecast/Actual 数据源、预测模型、标准人力、自动排班、生产公式、结算或计费规则。"
    verification:
      - "Focused roster persistence/service backend tests."
      - "Migration head creates roster persistence tables."
      - "git diff --check"
      - "bash scripts/check-state.sh --strict"
      - "BPO_NODE22_BIN=/opt/homebrew/opt/node@22/bin bash scripts/check.sh"
