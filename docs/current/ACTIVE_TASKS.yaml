version: 1
updated_at: "2026-05-18"
source_of_truth: "current_active_tasks"
notes:
  - "Only current executable tasks belong here."
  - "Each ready story must have a matching active task before execution."
  - "Done task history stays in legacy files or archive during the transition."
  - "Each active task keeps only the minimum execution contract: id, story_ids, status, gate, branch, allowed_files, traceability_files, forbidden_files, stop_conditions, acceptance_ref, verification, evidence_expected."
batch:
  id: batch-032-product-semantics-cleanup
  branch: codex/f-batch-032-product-semantics-cleanup
  task_ids: ["F145", "Q070"]
  allowed_gate_combo: ["frontend-scaffold", "qa"]
  scope_reason: "F145 and Q070 share the same product-semantics cleanup scope, branch, files, and verification path."
  scope: "清理业务页面中的导入/演示/验收痕迹；导入信息保留在 demo-imports 和 QA 文档。"
  risk: medium
tasks:
  - id: F145
    story_ids: ["US225"]
    status: in_progress
    gate: frontend-scaffold
    branch: codex/f-batch-032-product-semantics-cleanup
    allowed_files:
      - "app/**"
      - "components/**"
      - "scripts/tests/dashboard-table-model.test.mjs"
      - "tests/e2e/core-path.spec.ts"
      - "docs/**"
      - "tasks/backlog.yaml"
      - "next-env.d.ts"
    traceability_files:
      - "docs/current/PROJECT_CONTEXT.md"
      - "docs/current/STORY_QUEUE.yaml"
      - "docs/current/ACTIVE_TASKS.yaml"
      - "docs/registry/TRACE_INDEX.yaml"
      - "docs/raw-requirements.md"
      - "docs/user-stories.md"
      - "tasks/backlog.yaml"
      - "docs/task-log.md"
      - "docs/audit-report.md"
      - "docs/dev/branch-log.md"
      - "docs/PROJECT_STATE.md"
    forbidden_files:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
    stop_conditions:
      - "需要新增依赖或修改 package/lockfile"
      - "需要后端新契约、数据库、ORM、migration、schema 或生产持久化配置"
      - "需要真实外部集成、认证、权限实现、审批、导出、批量、生产写回、生产公式、结算规则、收费因子或真实锁账"
      - "验证失败"
    acceptance_ref: tasks/backlog.yaml#F145
    verification:
      - "node --experimental-strip-types --test scripts/tests/dashboard-table-model.test.mjs"
      - "npm run typecheck"
      - "npm run e2e:smoke"
      - "git diff --check"
      - "bash scripts/check-state.sh --strict --diff=working"
      - "bash scripts/check.sh"
    evidence_expected:
      - "核心业务页不再用 records/processed records 作为主标题或主指标。"
      - "业务页面不再把本机只读、localhost-only、不接数据库、演示边界当成功能内容。"
      - "导入/批次/验收语言保留在 demo-imports、审计或 QA 文档。"
  - id: Q070
    story_ids: ["US226"]
    status: ready
    gate: qa
    branch: codex/f-batch-032-product-semantics-cleanup
    allowed_files:
      - "app/**"
      - "components/**"
      - "scripts/tests/dashboard-table-model.test.mjs"
      - "tests/e2e/core-path.spec.ts"
      - "docs/**"
      - "tasks/backlog.yaml"
      - "next-env.d.ts"
    traceability_files:
      - "docs/task-log.md"
      - "docs/audit-report.md"
      - "docs/dev/branch-log.md"
      - "docs/PROJECT_STATE.md"
    forbidden_files:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
    stop_conditions:
      - "需要数据库、真实外部集成、认证、权限实现、审批、导出、批量、生产公式、结算规则、收费因子或真实锁账"
      - "验证失败"
    acceptance_ref: tasks/backlog.yaml#Q070
    verification:
      - "npm run e2e:smoke"
      - "git diff --check"
      - "bash scripts/check-state.sh --strict --diff=working"
      - "bash scripts/check.sh"
    evidence_expected:
      - "E2E 断言业务页面真实功能 marker，而非导入/records marker。"
      - "审计记录说明演示数据不再影响业务页面表达。"
