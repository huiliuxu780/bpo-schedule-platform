      - "`bash scripts/check-state.sh --strict`、前端模型测试、shadcn gate、页面 smoke、`git diff --check` 和 `bash scripts/check.sh` 通过。"
    auto_run: true
    pm_confirmation_required: false
    conflict_risk: medium
    stop_conditions:
