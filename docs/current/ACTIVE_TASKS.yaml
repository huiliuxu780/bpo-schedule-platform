      - "最终验证失败"
    acceptance_ref: "docs/e2e-smoke.md#R004"
    verification:
      - "git diff --check"
      - "bash scripts/check-state.sh --strict --diff=working"
      - "bash scripts/check.sh"
      - "bash scripts/smoke-demo.sh"
      - "npm run e2e:smoke"
    evidence_expected:
      - "Browser-level smoke covers dashboard, demand plans, schedule plans, plan detail, risk, shift, and unavailability return context"
      - "E2E command can run against a running local demo"
      - "No business behavior changes were made to satisfy the E2E"
