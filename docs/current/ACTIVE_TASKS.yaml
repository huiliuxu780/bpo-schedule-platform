version: 1
updated_at: "2026-05-13"
source_of_truth: "current_active_tasks"
notes:
  - "Only current executable tasks belong here."
  - "Each ready story must have a matching active task before execution."
  - "Done task history stays in legacy files or archive during the transition."
  - "Each active task keeps only the minimum execution contract: id, story_ids, status, gate, branch, allowed_files, traceability_files, forbidden_files, stop_conditions, acceptance_ref, verification, evidence_expected."
tasks:
  - id: H034
    story_ids: [US126]
    status: in_progress
    gate: state-hygiene
    branch: codex/f073-review-checklist-h032
    allowed_files:
      - "docs/current/**"
      - "docs/registry/**"
      - "docs/quality/**"
      - "docs/harness/lightweight-harness.md"
      - "docs/PROJECT_STATE.md"
      - "docs/raw-requirements.md"
      - "docs/user-stories.md"
      - "docs/task-log.md"
      - "docs/decision-log.md"
      - "docs/audit-report.md"
      - "docs/dev/branch-log.md"
      - "tasks/backlog.yaml"
      - "scripts/check-state.sh"
      - "scripts/validate-commit-message.mjs"
      - "scripts/tests/check-state.test.mjs"
      - "scripts/tests/validate-commit-message.test.mjs"
    traceability_files:
      - "docs/current/**"
      - "docs/registry/**"
      - "docs/raw-requirements.md"
      - "docs/user-stories.md"
      - "docs/task-log.md"
      - "docs/decision-log.md"
      - "docs/audit-report.md"
      - "docs/dev/branch-log.md"
      - "docs/PROJECT_STATE.md"
      - "tasks/backlog.yaml"
    forbidden_files:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
    stop_conditions:
      - "验证失败"
      - "需要业务代码改动"
      - "需要新增依赖或修改 package/lockfile"
      - "需要后端接口、真实数据源、数据库、认证或权限"
      - "需要审批、导出、批量调班、自动排班或生产工作流能力"
      - "需要固化生产风险公式、状态码、结算规则或收费因子"
    acceptance_ref: "tasks/backlog.yaml#H034"
    verification:
      - "bash scripts/check-state.sh --strict --diff=working"
      - "node --test scripts/tests/check-state.test.mjs"
      - "node --test scripts/tests/validate-commit-message.test.mjs"
      - "git diff --check"
      - "bash scripts/check.sh"
    evidence_expected:
      - "Same-commit product closeout passes strict state checks."
      - "Commit message validation accepts closeout task ids derived from HEAD active task context."
