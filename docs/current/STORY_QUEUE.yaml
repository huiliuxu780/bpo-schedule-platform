    acceptance:
      - "`/data-quality/[batchId]` 在应用成功后的当前批次语境展示结果卡片，明确应用目标、生成版本、应用时间或当前可见写入状态。"
      - "结果卡片根据 file_type 给出下一步入口，能继续进入已有下游结果追踪、结果列表或复核工作区，而不是只停留在通用成功提示。"
